[package]
name = "aegis_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
ureq = { version = "2.10", default-features = false, features = ["tls"] } # Ultra hafif senkron/thread-pool HTTP istemcisi
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
